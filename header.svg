<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="850" height="240">
  <defs>
    <style>
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes fall{0%{opacity:0;transform:translateY(-25px)}8%{opacity:.3}85%{opacity:.07}100%{opacity:0;transform:translateY(250px)}}
      @keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
      @keyframes ein{to{opacity:1}}
      .bg{fill:#0d1117}
      .bar{fill:#161b22}
      .dr{fill:#ff5f57}.dy{fill:#febc2e}.dg{fill:#28c840}
      .tt{fill:#8b949e;font-family:'Courier New',Consolas,monospace;font-size:12px}
      .a{fill:#818cf8;font-family:'Courier New',Consolas,monospace}
      .w{fill:#c9d1d9;font-family:'Courier New',Consolas,monospace}
      .d{fill:#6e7681;font-family:'Courier New',Consolas,monospace}
      .cur{fill:#6366f1;animation:blink 1s step-end infinite}
      .gl{animation:glow 3s ease-in-out infinite}
      .z{opacity:0;animation:ein .35s ease-out forwards}
      .z1{animation-delay:.2s}.z2{animation-delay:.7s}.z3{animation-delay:1.3s}
      .z4{animation-delay:1.8s}.z5{animation-delay:2.4s}.z6{animation-delay:3.0s}.z7{animation-delay:3.4s}
      .r{font-family:monospace;font-size:13px;fill:#6366f1;opacity:0}
      .f1{animation:fall 3.8s linear infinite}
      .f2{animation:fall 4.6s linear infinite;animation-delay:.4s}
      .f3{animation:fall 3.2s linear infinite;animation-delay:.9s}
      .f4{animation:fall 5.1s linear infinite;animation-delay:.2s}
      .f5{animation:fall 4.0s linear infinite;animation-delay:1.3s}
      .f6{animation:fall 5.5s linear infinite;animation-delay:.6s}
      .f7{animation:fall 3.6s linear infinite;animation-delay:1.1s}
      .f8{animation:fall 4.3s linear infinite;animation-delay:.15s}
      .f9{animation:fall 5.0s linear infinite;animation-delay:.75s}
      .f10{animation:fall 3.4s linear infinite;animation-delay:1.6s}
      .f11{animation:fall 4.8s linear infinite;animation-delay:.35s}
      .f12{animation:fall 3.9s linear infinite;animation-delay:1.0s}
      .f13{animation:fall 5.3s linear infinite;animation-delay:.55s}
      .f14{animation:fall 4.1s linear infinite;animation-delay:1.4s}
      .f15{animation:fall 3.5s linear infinite;animation-delay:.85s}
      .f16{animation:fall 4.7s linear infinite;animation-delay:.25s}
    </style>
  </defs>

  <rect class="bg" width="850" height="240" rx="10"/>
  <rect class="bar" width="850" height="34" rx="10"/>
  <rect class="bar" y="20" width="850" height="14"/>
  <circle class="dr" cx="22" cy="17" r="6"/>
  <circle class="dy" cx="44" cy="17" r="6"/>
  <circle class="dg" cx="66" cy="17" r="6"/>
  <text class="tt" x="425" y="21" text-anchor="middle">nabez@selly: ~</text>

  <text class="r f1" x="40" y="-5">{</text>
  <text class="r f2" x="105" y="-5">€</text>
  <text class="r f3" x="170" y="-5">;</text>
  <text class="r f4" x="235" y="-5">&amp;</text>
  <text class="r f5" x="300" y="-5">1</text>
  <text class="r f6" x="365" y="-5">→</text>
  <text class="r f7" x="430" y="-5">}</text>
  <text class="r f8" x="495" y="-5">0</text>
  <text class="r f9" x="560" y="-5">%</text>
  <text class="r f10" x="620" y="-5">::</text>
  <text class="r f11" x="680" y="-5">#</text>
  <text class="r f12" x="740" y="-5">&lt;</text>
  <text class="r f13" x="800" y="-5">€</text>
  <text class="r f14" x="140" y="-5">fn</text>
  <text class="r f15" x="520" y="-5">&gt;</text>
  <text class="r f16" x="700" y="-5">→</text>

  <text class="a z z1" x="30" y="66" font-size="14">$ whoami</text>
  <g class="z z2">
    <text class="w gl" x="30" y="89" font-size="15" font-weight="bold">Nabez</text>
    <text class="d" x="96" y="89" font-size="14">— Sales Manager &amp; average Leptos Enjoyer</text>
  </g>

  <text class="a z z3" x="30" y="126" font-size="14">$ cat mission.txt</text>
  <text class="w z z4" x="30" y="149" font-size="14">Make Software as a Service great again.</text>

  <text class="a z z5" x="30" y="186" font-size="14">$ cargo run --release -p selly-server</text>
  <text class="d z z6" x="30" y="208" font-size="14">SIG – SaaS ist geil.</text>

  <g class="z z7">
    <text class="a" x="30" y="230" font-size="14">$</text>
    <rect class="cur" x="44" y="219" width="9" height="15"/>
  </g>
</svg>
