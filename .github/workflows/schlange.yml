name: Schlange

# Zeichnet das Beitragsraster des letzten Jahres als Schlange und legt die
# beiden SVGs auf den Zweig `output`, von dem das README sie lädt.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  schlange:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/schlange.svg?palette=github-light&color_snake=#4f46e5&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#6366f1,#4338ca
            dist/schlange-dunkel.svg?palette=github-dark&color_snake=#818cf8&color_dots=#161b22,#1e1b4b,#312e81,#4f46e5,#818cf8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
