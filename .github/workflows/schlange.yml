name: Schlange

# Zeichnet das Beitragsraster des letzten Jahres als Schlange und legt die
# beiden SVGs auf den Zweig `output`, von dem das README sie lädt.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  schlange:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/schlange.svg?palette=github-light&color_snake=#c2334a
            dist/schlange-dunkel.svg?palette=github-dark&color_snake=#ef4b62&color_dots=#161b22,#4a1520,#7a1f30,#c2334a,#ef4b62

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
